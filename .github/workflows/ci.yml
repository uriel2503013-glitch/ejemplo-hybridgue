name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-package:
    name: Compilar, probar y empaquetar
    runs-on: windows-latest

    steps:
      # Fuente: descarga el codigo del repositorio.
      - name: Fuente - checkout del repositorio
        uses: actions/checkout@v7

      # Build: configura Node.js con cache npm y verifica la sintaxis del programa.
      - name: Build - configurar Node.js y cachear dependencias
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build - instalar dependencias
        run: npm ci

      - name: Build - comprobar sintaxis
        run: npm run build

      # Pruebas: ejecuta las pruebas unitarias con el test runner integrado de Node.js.
      - name: Pruebas - ejecutar pruebas unitarias
        run: npm test

      # Empaquetado: crea un ZIP de la aplicacion y lo publica como artefacto descargable.
      - name: Empaquetado - crear paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path ejemplos.js, README.md, package.json, package-lock.json -DestinationPath artifacts/ejemplo-hybridgue.zip

      - name: Empaquetado - subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: ejemplo-hybridgue
          path: artifacts/ejemplo-hybridgue.zip
          if-no-files-found: error
          retention-days: 14

      # Despliegue: paso preparado para agregar las credenciales y el comando de staging.
      # - name: Despliegue - publicar en staging
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   env:
      #     STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
      #   run: npm run deploy:staging
